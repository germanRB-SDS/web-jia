<main class="sortable-card-list" data-sortable-cards>
  <section class="sortable-card" data-card-id="profile">
    <header class="sortable-card-header">
      <h2>Profile</h2>
      <button class="drag-relocate-button" type="button" data-drag-handle aria-label="Move section">
        <span aria-hidden="true">::</span>
      </button>
    </header>
    <label>Name <input name="name" value="Example"></label>
  </section>
  <section class="sortable-card" data-card-id="settings">
    <header class="sortable-card-header">
      <h2>Settings</h2>
      <button class="drag-relocate-button" type="button" data-drag-handle aria-label="Move section">
        <span aria-hidden="true">::</span>
      </button>
    </header>
    <label><input type="checkbox"> Enabled</label>
  </section>
</main>

<script type="module" src="../javascript/drag-relocate-button.js"></script>
