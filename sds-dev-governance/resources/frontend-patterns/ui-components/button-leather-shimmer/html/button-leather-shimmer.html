<!-- Button — leather shimmer -->
<!-- CTA de superficie física: degradado diagonal, relieve de dos sombras y un destello inclinado que
     la cruza cada pocos segundos. Funciona igual en <a> o <button>.

     Dos variantes de icono, ambas opcionales:
       - una flecha, que avanza al pasar el puntero (comportamiento por defecto de cualquier <svg>);
       - una chapa/insignia marcada con `bls-btn__badge`, que gira sobre sí misma.

     El rótulo visible sale de la capa de textos/i18n del proyecto: aquí está escrito solo para el demo. -->

<!-- Con flecha: el botón lleva a otro sitio. -->
<a class="bls-btn" href="#">
  <span>Explorar</span>
  <svg width="18" height="18" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M10 32h42" />
    <path d="M38 18l14 14-14 14" />
  </svg>
</a>

<!-- Con chapa: el botón es la acción principal y la insignia gira. -->
<a class="bls-btn" href="#">
  <span>Acción principal</span>
  <svg class="bls-btn__badge" width="18" height="18" viewBox="0 0 64 64" fill="currentColor"
       aria-hidden="true" focusable="false">
    <path d="M32 7l6.2 16.5L55.8 24.3 42 35.2l4.7 17L32 42.5 17.3 52.2 22 35.2 8.2 24.3l17.6-.8L32 7Z" />
    <circle cx="32" cy="7" r="3.4" />
    <circle cx="55.8" cy="24.3" r="3.4" />
    <circle cx="46.7" cy="52.2" r="3.4" />
    <circle cx="17.3" cy="52.2" r="3.4" />
    <circle cx="8.2" cy="24.3" r="3.4" />
  </svg>
</a>

<!-- Sin icono: igual de válido. -->
<button class="bls-btn" type="button">Enviar</button>

<!-- Re-tematizado por instancia (o, mejor, en una regla del proyecto que mapee los tokens de diseño). -->
<a class="bls-btn" href="#"
   style="--bls-c1: #1f3d2e; --bls-c2: #2f5c46; --bls-ink: 12, 24, 18; --bls-glint: 233, 244, 238; --bls-radius: 999px;">
  <span>Otra paleta</span>
</a>
